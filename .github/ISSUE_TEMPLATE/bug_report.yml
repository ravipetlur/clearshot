name: Bug report
description: Something in ClearShot doesn't work as the README describes.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting it. A security problem goes privately to the maintainer instead, as [SECURITY.md](https://github.com/ravipetlur/clearshot/blob/main/SECURITY.md) describes.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what ClearShot did instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Press ⇧⌘4
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ClearShot version
      description: Settings › About, or the release you downloaded.
      placeholder: 1.2.0 (42)
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: macOS 27.0.1, MacBook Pro (M3)
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Where your copy came from
      options:
        - A release DMG
        - Built from source
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log lines
      description: The lines around the problem from ~/Library/Logs/ClearShot/clearshot.log, if any. Check them for anything private first.
      render: text
