# Builds the app, which must stay warning-free, and runs ClearShotKit's tests, on every push to main and every pull
# request. The release workflow calls it too (workflow_call), so a release passes the same gate.
#
# Third-party actions are pinned to full commit SHAs, with the version in a comment; Dependabot keeps them current.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run still going. The workflow's name is in the group
# because the release workflow runs this one as its gate, and a called workflow sees the caller's context: without it,
# a release dry run on main and a push to main would share a group and one would cancel the other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Explicit bash runs with -e and -o pipefail.
    shell: bash

jobs:
  build:
    # The required status check on main is this name.
    name: Build and test
    # GitHub's hosted xcode-27 image (arm64, public preview): macOS 27.0 with Xcode 27.0 as its default
    # (/Applications/Xcode_27.app), plus Xcode 27.1 and a 27.2 beta, and the macosx27.0 SDK. Homebrew is installed;
    # XcodeGen isn't. Hosted macOS runners are free for public repositories.
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      # The XcodeGen release the project is generated with, and its zip's SHA-256 (as GitHub lists it for the asset).
      XCODEGEN_VERSION: 2.46.0
      XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Xcode 27.0 by version, not whatever the image's default becomes: the toolchain the project is checked with.
      - name: Select Xcode 27.0
        run: |
          is_27_0() { [[ $("$1" -version 2> /dev/null | sed -n 1p) =~ ^Xcode\ 27\.0(\.[0-9]+)?$ ]]; }
          for candidate in /Applications/Xcode_27.0.app /Applications/Xcode_27.app; do
            if [ -d "$candidate" ] && is_27_0 "$candidate/Contents/Developer/usr/bin/xcodebuild"; then
              sudo xcode-select --switch "$candidate/Contents/Developer"
              break
            fi
          done
          if ! is_27_0 xcodebuild; then
            echo "::error::Xcode 27.0 isn't installed on this runner."
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          xcodebuild -version
          swift --version
          sw_vers

      - name: Restore XcodeGen
        id: xcodegen-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/xcodegen-${{ env.XCODEGEN_VERSION }}
          key: xcodegen-${{ env.XCODEGEN_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      # The pinned release, checked against its SHA-256, rather than whichever version Homebrew has.
      - name: Install XcodeGen
        if: steps.xcodegen-cache.outputs.cache-hit != 'true'
        run: |
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 --check --strict
          mkdir -p ~/"xcodegen-$XCODEGEN_VERSION"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d ~/"xcodegen-$XCODEGEN_VERSION"
          rm "$RUNNER_TEMP/xcodegen.zip"

      - name: Put XcodeGen on the PATH
        run: |
          echo "$HOME/xcodegen-$XCODEGEN_VERSION/xcodegen/bin" >> "$GITHUB_PATH"
          "$HOME/xcodegen-$XCODEGEN_VERSION/xcodegen/bin/xcodegen" --version

      # ClearShotKit's own build folder (its dependencies' checkouts and their build products), SwiftPM's shared caches
      # and the app build's package checkouts. Keyed on the package's pins and the toolchain.
      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ClearShotKit/.build
            build/DerivedData/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode-27.0-${{ hashFiles('ClearShotKit/Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode-27.0-

      # make build runs xcodebuild -quiet, which prints only problems: any warning: or error: line fails the job.
      - name: Build the app (warning-free)
        run: |
          make build 2>&1 | tee "$RUNNER_TEMP/build.log"
          if grep -E 'warning:|error:' "$RUNNER_TEMP/build.log" > "$RUNNER_TEMP/problems.log"; then
            echo "::error title=Build not warning-free::xcodebuild printed $(wc -l < "$RUNNER_TEMP/problems.log" | tr -d ' ') warning or error lines; the build must stay warning-free."
            cat "$RUNNER_TEMP/problems.log"
            exit 1
          fi

      # Tests that need what a Mac may lack skip themselves with a reason (CSTestSupport: HardwareEncoders,
      # VisionTextRecognition); on this runner, Vision's text recognition can't run. swift-testing logs each skip as
      # `➜ Test name() skipped: "reason"`, and the run's total counts skipped tests too, so the count and the reasons go
      # to the job summary, with a warning, where a whole suite skipped can't go unnoticed.
      - name: Test ClearShotKit
        run: |
          status=0
          swift test --package-path ClearShotKit 2>&1 | tee "$RUNNER_TEMP/test.log" || status=$?
          skipped=$(grep -E '^[^ ]+ Test .+ skipped: ' "$RUNNER_TEMP/test.log" || true)
          count=$(printf '%s' "$skipped" | grep -c '^' || true)
          {
            echo "### ClearShotKit tests"
            if [ "$count" -eq 0 ]; then
              echo "No tests skipped."
            else
              echo "**$count skipped**, by reason:"
              echo
              printf '%s\n' "$skipped" | sed -E 's/^.* skipped: "(.*)"$/\1/' | sort | uniq -c |
                sed -E 's/^ *([0-9]+) (.*)$/- \1: \2/'
              echo
              echo "<details><summary>The skipped tests</summary>"
              echo
              printf '%s\n' "$skipped" | sed -E 's/^[^ ]+ Test (.+) skipped: .*$/- `\1`/'
              echo
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -gt 0 ]; then
            echo "::warning title=Skipped tests::$count tests skipped on this runner; the job summary lists them and why."
          fi
          exit "$status"
