name: ClearShot
options:
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
  developmentLanguage: en
# The bundle identifier and the signing identity come from Config/Defaults.xcconfig (com.example.clearshot, signed to
# run locally), overridden by Config/Local.xcconfig when it exists (git-ignored; see Config/Local.example.xcconfig).
# They're left out of the settings below, which would override the files.
configFiles:
  Debug: Config/Defaults.xcconfig
  Release: Config/Defaults.xcconfig
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    ARCHS: arm64
    # Another process running as the user can't inject code into ClearShot and borrow its Screen Recording,
    # Microphone and Accessibility grants. The entitlements below are the only exceptions it needs.
    ENABLE_HARDENED_RUNTIME: YES
    # Xcode adds the runtime option only when it signs with a certificate, so an ad hoc signature (the defaults in
    # Config/Defaults.xcconfig) asks for it here. With a certificate the option is given twice, which codesign accepts.
    OTHER_CODE_SIGN_FLAGS: $(inherited) --options=runtime
    # No get-task-allow, which Xcode otherwise adds to every build signed for development, Release included: it would
    # let a debugger running as the user attach and inject all the same. Every build holds the same grants, so none has
    # it. Set YES locally to debug from Xcode.
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
packages:
  ClearShotKit:
    path: ClearShotKit
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "3.1.0"
targets:
  ClearShot:
    type: application
    platform: macOS
    sources:
      - path: ClearShot
    info:
      path: ClearShot/Info.plist
      properties:
        CFBundleDisplayName: ClearShot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: Copyright © The ClearShot Authors. Apache License 2.0.
        NSMicrophoneUsageDescription: ClearShot uses the microphone only while recording, to record your voice.
        ClearShotDefaultSaveFolder: $(CLEARSHOT_DEFAULT_SAVE_FOLDER)
        CFBundleDocumentTypes:
          - CFBundleTypeName: ClearShot Project
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSTypeIsPackage: true
            LSItemContentTypes: [$(PRODUCT_BUNDLE_IDENTIFIER).document]
          - CFBundleTypeName: Image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.image]
          - CFBundleTypeName: Movie
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.movie]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER).document
            UTTypeDescription: ClearShot Project
            UTTypeConformsTo: [com.apple.package, public.composite-content]
            UTTypeTagSpecification:
              public.filename-extension: [clearshot]
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [clearshot]
    # Under the hardened runtime: the microphone, for a recording's voice (AVCaptureSession). Nothing else ClearShot
    # does needs an exception (screen capture, system audio, the Keychain, the shortcuts command, Accessibility).
    entitlements:
      path: ClearShot/ClearShot.entitlements
      properties:
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_NAME: ClearShot
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_STRICT_CONCURRENCY: complete
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: ClearShotKit
        product: CSCore
      - package: ClearShotKit
        product: CSCapture
      - package: ClearShotKit
        product: CSHistory
      - package: ClearShotKit
        product: CSAnnotation
      - package: ClearShotKit
        product: CSOCR
      - package: ClearShotKit
        product: CSScrolling
      - package: ClearShotKit
        product: CSRecording
      - package: ClearShotKit
        product: CSAPI
      - package: KeyboardShortcuts
schemes:
  ClearShot:
    build:
      targets:
        ClearShot: all
    run:
      config: Debug
